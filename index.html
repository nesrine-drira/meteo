<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Météo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(160deg, #1e3a5f 0%, #2c6e91 60%, #4a9fb5 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    color: #1d2b3a;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: rgba(255, 255, 255, 0.92);
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
    backdrop-filter: blur(6px);
  }
  h1 { font-size: 1.5rem; margin-bottom: 20px; text-align: center; }
  .search {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  input[type="text"] {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus { border-color: #2c6e91; }
  button {
    padding: 10px 18px;
    background: #2c6e91;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #1e5a7a; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .result { text-align: center; padding: 8px 0; }
  .city-name { font-size: 1.25rem; font-weight: 600; margin-bottom: 6px; }
  .temp { font-size: 3rem; font-weight: 700; color: #1e3a5f; }
  .desc { font-size: 1.1rem; color: #475569; margin-top: 4px; }
  .icon { font-size: 3rem; margin-bottom: 8px; }
  .hidden { display: none; }
  .error {
    background: #fee2e2;
    border: 1px solid #fecaca;
    color: #991b1b;
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    margin-bottom: 16px;
  }
  #map { height: 260px; border-radius: 10px; margin-top: 16px; }
  .loading { text-align: center; color: #64748b; padding: 12px; }
  .advice {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 10px;
    background: #eef6ff;
    border: 1px solid #cfe3f7;
    display: flex;
    align-items: center;
    gap: 12px;
    text-align: left;
  }
  .advice .advice-emoji { font-size: 2rem; flex-shrink: 0; }
  .advice .advice-title { font-weight: 600; color: #1e3a5f; margin-bottom: 2px; }
  .advice .advice-text { color: #475569; font-size: 0.95rem; }
</style>
</head>
<body>
  <div class="card">
    <h1>&#9925; Météo</h1>
    <form id="searchForm" class="search">
      <input type="text" id="cityInput" placeholder="Ex : Paris, Lyon, Montréal..." autocomplete="off">
      <button type="submit" id="btn">Voir la météo</button>
    </form>
    <div id="error" class="error hidden"></div>
    <div id="result" class="result hidden">
      <div class="icon" id="icon"></div>
      <div class="city-name" id="cityName"></div>
      <div class="temp" id="temp"></div>
      <div class="desc" id="desc"></div>
    </div>
    <div id="loading" class="loading hidden">Chargement...</div>
    <div id="advice" class="advice hidden">
      <div class="advice-emoji" id="adviceEmoji"></div>
      <div>
        <div class="advice-title" id="adviceTitle"></div>
        <div class="advice-text" id="adviceText"></div>
      </div>
    </div>
    <div id="map"></div>
  </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const WEATHER_TEXT = {
    0: 'Ciel clair',
    1: 'Plutôt dégagé',
    2: 'Nuageux',
    3: 'Couvert',
    45: 'Brouillard',
    48: 'Brouillard givrant',
    51: 'Bruine légère',
    53: 'Bruine',
    55: 'Bruine dense',
    61: 'Pluie légère',
    63: 'Pluie',
    65: 'Forte pluie',
    71: 'Neige légère',
    73: 'Neige',
    75: 'Forte neige',
    77: 'Grains de neige',
    80: 'Averses légères',
    81: 'Averses',
    82: 'Averses violentes',
    95: 'Orage',
    96: 'Orage avec grêle',
    99: 'Orage violent avec grêle'
  };

  const WEATHER_ICON = {
    0: '☀️', 1: '🌤️', 2: '⛅', 3: '☁️',
    45: '🌫️', 48: '🌫️',
    51: '🌦️', 53: '🌦️', 55: '🌧️',
    61: '🌧️', 63: '🌧️', 65: '🌧️',
    71: '🌨️', 73: '🌨️', 75: '❄️', 77: '❄️',
    80: '🌦️', 81: '🌧️', 82: '🌧️',
    95: '⛈️', 96: '⛈️', 99: '⛈️'
  };

  let map = null;
  let marker = null;

  function weatherText(code) {
    return WEATHER_TEXT[code] || 'Conditions inconnues';
  }

  function weatherIcon(code) {
    return WEATHER_ICON[code] || '🌡️';
  }

  function getAdvice(temp, code) {
    if (code >= 95 && code <= 99) {
      return ['⛈️', 'Orage en cours', 'Restez à l\'abri et évitez les objets métalliques et les arbres.'];
    }
    if (code >= 71 && code <= 77) {
      return ['⛄', 'Il neige', 'Couvrez-vous chaudement, attention au verglas et aux routes glissantes.'];
    }
    if (code >= 51 && code <= 67) {
      return ['☔', 'Il pleut', 'Pensez à prendre un parapluie et un imperméable.'];
    }
    if (code >= 80 && code <= 82) {
      return ['🌦️', 'Averses', 'Des averses passent : gardez un parapluie à portée de main.'];
    }
    if (code >= 45 && code <= 48) {
      return ['🌫️', 'Brouillard', 'Visibilité réduite : soyez prudent en conduisant et en vous déplaçant.'];
    }
    if (temp >= 32) {
      return ['🥵', 'Très forte chaleur', 'Buvez de l\'eau régulièrement et évitez les efforts en plein soleil.'];
    }
    if (temp >= 27) {
      return ['💧', 'Il fait chaud', 'Hydratez-vous bien, buvez de l\'eau et protégez-vous du soleil.'];
    }
    if (temp <= -5) {
      return ['🥶', 'Grand froid', 'Habillez-vous très chaudement et limitez le temps passé dehors.'];
    }
    if (temp <= 2) {
      return ['🧥', 'Il gèle', 'Mettez un manteau chaud, gants et écharpe.'];
    }
    if (temp >= 3 && temp < 27 && code === 0) {
      return ['😎', 'Temps dégagé', 'Il fait beau, profitez-en pour sortir et prendre l\'air !'];
    }
    return ['👍', 'Temps correct', 'Conditions normales, bonne journée à vous !'];
  }

  async function geocode(city) {
    const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=fr`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('network');
    const data = await res.json();
    return data.results ? data.results[0] : null;
  }

  async function getWeather(lat, lon) {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('network');
    return res.json();
  }

  async function reverseGeocode(lat, lon) {
    const url = `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=fr`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('reverse');
    return res.json();
  }

  async function updateWeatherAt(lat, lon, label) {
    try {
      const data = await getWeather(lat, lon);
      let place = label;
      let country = '';
      try {
        const info = await reverseGeocode(lat, lon);
        place = info.city || info.locality || info.principalSubdivision || label;
        country = info.countryName || '';
      } catch (e) {
        // géocodage inverse indisponible : on garde les coordonnées
      }
      displayWeather({ name: place, country, latitude: lat, longitude: lon }, data);
    } catch (err) {
      showError('Erreur réseau. Réessayez plus tard.');
    }
  }

  function formatCoords(lat, lon) {
    return `${lat.toFixed(3)}°, ${lon.toFixed(3)}°`;
  }

  function showError(message) {
    const box = document.getElementById('error');
    box.textContent = message;
    box.classList.remove('hidden');
    document.getElementById('result').classList.add('hidden');
    document.getElementById('advice').classList.add('hidden');
  }

  function initMap(lat, lon) {
    const container = document.getElementById('map');
    container.classList.remove('hidden');
    if (map) map.remove();
    map = L.map('map').setView([lat, lon], 10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    marker = L.marker([lat, lon], { draggable: true }).addTo(map);
    marker.bindTooltip('Déplacez-moi').openTooltip();
    marker.on('dragend', (e) => {
      const pos = e.target.getLatLng();
      updateWeatherAt(pos.lat, pos.lng, formatCoords(pos.lat, pos.lng));
    });
    map.on('click', (e) => {
      marker.setLatLng(e.latlng);
      updateWeatherAt(e.latlng.lat, e.latlng.lng, formatCoords(e.latlng.lat, e.latlng.lng));
    });
  }

  function displayWeather(location, data) {
    const current = data.current;
    const code = current.weather_code;
    document.getElementById('icon').textContent = weatherIcon(code);
    document.getElementById('cityName').textContent =
      `${location.name}${location.country ? ' — ' + location.country : ''}`;
    document.getElementById('temp').textContent = `${Math.round(current.temperature_2m)}°C`;
    document.getElementById('desc').textContent = weatherText(code);
    const [emoji, title, text] = getAdvice(current.temperature_2m, code);
    document.getElementById('adviceEmoji').textContent = emoji;
    document.getElementById('adviceTitle').textContent = title;
    document.getElementById('adviceText').textContent = text;
    document.getElementById('advice').classList.remove('hidden');
    document.getElementById('error').classList.add('hidden');
    document.getElementById('result').classList.remove('hidden');
    initMap(location.latitude, location.longitude);
  }

  document.getElementById('searchForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const city = document.getElementById('cityInput').value.trim();
    if (!city) return;

    const btn = document.getElementById('btn');
    btn.disabled = true;
    document.getElementById('loading').classList.remove('hidden');
    document.getElementById('result').classList.add('hidden');
    document.getElementById('advice').classList.add('hidden');

    try {
      const location = await geocode(city);
      if (!location) {
        showError(`Ville "${city}" introuvable. Vérifiez l'orthographe.`);
        return;
      }
      const data = await getWeather(location.latitude, location.longitude);
      displayWeather(location, data);
    } catch (err) {
      showError('Erreur réseau. Réessayez plus tard.');
    } finally {
      btn.disabled = false;
      document.getElementById('loading').classList.add('hidden');
    }
  });

  window.addEventListener('load', () => {
    initMap(48.8566, 2.3522);
    updateWeatherAt(48.8566, 2.3522, 'Paris');
  });
</script>
</body>
</html>
